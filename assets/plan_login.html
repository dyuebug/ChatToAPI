                            fill="#FFFFFF"></path>

                </div>
                <div class="brand-text">龙虾计划</div>
                </a>
            </div>

            <div class="nav" id="desktopNavContainer">
            </div>

            <script type="text/html" id="desktopNavTpl">
                {{# layui.each(d, function(index, item){ }}
                <a href="{{ item.href }}" class="nav-link" {{ item.id ? 'id="'+item.id+'"' : '' }} {{ item.target ? 'target="'+item.target+'"' : '' }}>{{ item.name }}</a>
                {{# }); }}
            </script>

            <div class="flex items-center gap-4">
                <div class="hidden flex items-center gap-4" id="authBtns">
                    <a class="btn btn-primary" href="login.shtml">登录</a>
                </div>

                <div class="flex items-center gap-4" id="userMenu">
                    <div class="user-dropdown">
                        <div class="flex items-center gap-2 cursor-pointer user-dropdown-toggle">
                            <div class="t-sm font-bold user-name-text">用户xxx</div>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                        </div>
                        <div class="user-dropdown-menu shadow-lg" id="userDropdownContainer">
                        </div>
                    </div>
                </div>

                <div class="nav-toggle" type="button" id="navToggle">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <script type="text/html" id="userDropdownTpl">
                {{# layui.each(d, function(index, item){ }}
                <a href="{{ item.href }}" class="user-dropdown-item">{{ item.name }}</a>
                {{# }); }}
                <div class="user-dropdown-divider"></div>
                <a href="/API/Web/User/DoLogout" class="user-dropdown-item text-danger">安全退出</a>
            </script>

            <script type="text/html" id="mobileNavTpl">
                {{# layui.each(d.mainNav, function(index, item){ }}
                <a href="{{ item.href }}" class="mobile-nav-link" {{ item.mobileId ? 'id="'+item.mobileId+'"' : (item.id ? 'id="'+item.id+'"' : '') }} {{ item.target ? 'target="'+item.target+'"' : '' }}>{{ item.name }}</a>
                {{# }); }}
            </script>
        </div>
    </header>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="32"

                <div class="t-h3">登录 OpenClawPlan</div>
                <div class="t-sm text-secondary mt-2">欢迎回来，请选择登录方式</div>
            </div>

            <div class="login-tabs">
                <div class="login-tab active" onclick="switchTab('qrcode')">微信扫码</div>
                <div class="login-tab" onclick="switchTab('code')">动态码登录</div>
            </div>

            <div id="qrcode-login" class="login-form active">
                <div class="qrcode-container">
                    <div id="qrcode" class="wechat-qrcode-container">
                        <img src="img/wechat.jpg" alt="公众号二维码" class="wechat-qrcode-img">
                    </div>

                    <div class="flex justify-center items-center gap-2 mt-4 text-secondary">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#07C160">
                            <path
                                d="M8.08 19.33c-1.42 0-2.83-.43-4-1.23-.39-.27-.85-.38-1.3-.28l-2.28.5c-.32.07-.63-.16-.65-.48-.01-.13.03-.26.11-.37l1.37-1.83c.23-.31.29-.71.14-1.07-.94-2.24-.65-4.81.9-6.75 1.77-2.21 4.69-3.21 7.42-2.55 2.73.66 4.78 3.01 5.21 5.79.43 2.78-.96 5.53-3.46 6.84-1.13.59-2.38.88-3.64.88l.18.55zm5.55-12.7c-2.07-.5-4.29.26-5.63 1.93-1.18 1.47-1.4 3.42-.69 5.12.19.46.12 1-.18 1.39l-1.05 1.4 1.72-.38c.58-.13 1.18 0 1.68.35 2.07 1.42 4.86 1.13 6.61-.7 1.89-.99 2.95-3.08 2.62-5.18-.33-2.1-1.89-3.88-3.95-4.38l-1.13.45z" />
                        </svg>
                        <div>关注公众号 微信扫码</div>
                    </div>
                </div>
            </div>

            <div id="code-login" class="login-form">
                <div class="qrcode-container">
                    <div id="code-qrcode" class="code-qrcode-container">
                        <img src="img/wechat.jpg" alt="公众号二维码" class="code-qrcode-img">
                    </div>
                </div>

                <div class="form-group login-code-group">
                    <div class="login-code-flex">
                        <input type="text" class="form-input" placeholder="请输入6位动态码">
                        <div class="btn btn-primary login-verify-btn">验证</div>
                    </div>
                </div>

                <div class="flex justify-center items-center gap-2 mt-4 text-secondary">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#07C160">
                        <path
                            d="M8.08 19.33c-1.42 0-2.83-.43-4-1.23-.39-.27-.85-.38-1.3-.28l-2.28.5c-.32.07-.63-.16-.65-.48-.01-.13.03-.26.11-.37l1.37-1.83c.23-.31.29-.71.14-1.07-.94-2.24-.65-4.81.9-6.75 1.77-2.21 4.69-3.21 7.42-2.55 2.73.66 4.78 3.01 5.21 5.79.43 2.78-.96 5.53-3.46 6.84-1.13.59-2.38.88-3.64.88l.18.55zm5.55-12.7c-2.07-.5-4.29.26-5.63 1.93-1.18 1.47-1.4 3.42-.69 5.12.19.46.12 1-.18 1.39l-1.05 1.4 1.72-.38c.58-.13 1.18 0 1.68.35 2.07 1.42 4.86 1.13 6.61-.7 1.89-.99 2.95-3.08 2.62-5.18-.33-2.1-1.89-3.88-3.95-4.38l-1.13.45z" />

                    <div class="t-sm text-secondary">
