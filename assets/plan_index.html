            <div class="nav" id="desktopNavContainer">
            </div>

            <script type="text/html" id="desktopNavTpl">
                {{# layui.each(d, function(index, item){ }}
                <a href="{{ item.href }}" class="nav-link" {{ item.id ? 'id="'+item.id+'"' : '' }} {{ item.target ? 'target="'+item.target+'"' : '' }}>{{ item.name }}</a>
                {{# }); }}
            </script>

            <div class="flex items-center gap-4">
                <div class="hidden flex items-center gap-4" id="authBtns">
                    <a class="btn btn-primary" href="login.shtml">登录</a>
                </div>

                <div class="flex items-center gap-4" id="userMenu">
                    <div class="user-dropdown">
                        <div class="flex items-center gap-2 cursor-pointer user-dropdown-toggle">
                            <div class="t-sm font-bold user-name-text">用户xxx</div>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                        </div>
                        <div class="user-dropdown-menu shadow-lg" id="userDropdownContainer">
                        </div>
                    </div>
                </div>

                <div class="nav-toggle" type="button" id="navToggle">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <script type="text/html" id="userDropdownTpl">
                {{# layui.each(d, function(index, item){ }}
                <a href="{{ item.href }}" class="user-dropdown-item">{{ item.name }}</a>
                {{# }); }}
                <div class="user-dropdown-divider"></div>
                <a href="/API/Web/User/DoLogout" class="user-dropdown-item text-danger">安全退出</a>
            </script>

            <script type="text/html" id="mobileNavTpl">
                {{# layui.each(d.mainNav, function(index, item){ }}
                <a href="{{ item.href }}" class="mobile-nav-link" {{ item.mobileId ? 'id="'+item.mobileId+'"' : (item.id ? 'id="'+item.id+'"' : '') }} {{ item.target ? 'target="'+item.target+'"' : '' }}>{{ item.name }}</a>
                {{# }); }}
            </script>
        </div>

    <div class="mobile-nav-backdrop" id="mobileNavBackdrop" aria-hidden="true">
        <div class="mobile-nav" id="mobileNav">

                <div class="mobile-nav-title">菜单</div>

                    </svg>

            </div>
            <div class="mobile-nav-links" id="mobileNavContainer">
            </div>
        </div>
    </div>
    <script type="text/html" id="aiCarouselTpl">
        {{# layui.each(d, function(index, item){ }}
        <div class="ai-slide" title="{{ item.name }}" style="cursor: pointer;">
            <div class="ai-slide-header">
                <div class="ai-slide-icon">
                    {{- item.icon }}
                </div>
                <div class="ai-slide-name">
                    {{ item.name }}
                </div>
            </div>
            <div class="ai-slide-desc">
                {{ item.desc }}
            </div>
            <div class="ai-slide-tags">
                {{# layui.each(item.tags, function(tIndex, tag){ }}
                <span>{{ tag }}</span>
                {{# }); }}
            </div>
        </div>
        {{# }); }}
    </script>
